services:
  squid-go:
    build:
      context: .
    ports:
      - "443:443"
    environment:
      ACME_DOMAIN: proxy.example.com
      ACME_EMAIL: ops@example.com
      PROXY_AUTH_SHA256: ${PROXY_AUTH_SHA256:?set PROXY_AUTH_SHA256 to a sha256(user:password) digest}
      # Optional: comma-separated client IPs / CIDRs allowed to use the
      # proxy without supplying credentials. Only list networks you fully
      # trust; matching is against the raw TCP peer address.
      # NO_AUTH_CIDRS: "10.0.0.0/24,192.0.2.7"
      CERT_STORAGE_PATH: /var/lib/squid-go
    volumes:
      - squid-go-certs:/var/lib/squid-go
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      # Block any setuid/file-capability privilege escalation inside the container.
      - no-new-privileges:true
    # Resource caps to contain abuse/DoS of an internet-facing proxy.
    pids_limit: 200
    mem_limit: 256m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    # Bound log growth so a noisy client can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  squid-go-certs:
