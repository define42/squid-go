[package]
name = "squid-go"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Minimal authenticated HTTPS forward proxy with optional Let's Encrypt (TLS-ALPN-01) certificate management."
license = "MIT"

[[bin]]
name = "squid-go"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = 3
panic = "abort"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "client", "client-legacy", "http1"] }
ipnet = "2"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std"] }
rustls-acme = { version = "0.15", default-features = false, features = ["aws-lc-rs", "tokio", "webpki-roots"] }
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
hyper = { version = "1", features = ["http1", "server", "client"] }
tokio = { version = "1", features = ["full", "test-util"] }
